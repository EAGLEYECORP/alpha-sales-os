};

const MAIL = "eagleyecorp.ad@gmail.com";

function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll("[data-k]").forEach((el) => {
    const v = I18N[l][el.dataset.k];
    if (v !== undefined) el.innerHTML = v;
  });
  const href = `mailto:${MAIL}?subject=${encodeURIComponent(I18N[l].mail_subject)}&body=${I18N[l].mail_body}`;
  document.getElementById("cta-top").href = href;
  document.getElementById("cta-bottom").href = href;
  document.getElementById("btn-fr").classList.toggle("on", l === "fr");
  document.getElementById("btn-en").classList.toggle("on", l === "en");
  try { localStorage.setItem("alpha_site_lang", l); } catch {}
}

document.getElementById("yr").textContent = new Date().getFullYear();
let lang = "fr";
try { lang = localStorage.getItem("alpha_site_lang") || (navigator.language.startsWith("fr") ? "fr" : "en"); } catch {}
setLang(lang === "en" ? "en" : "fr");
</script>
