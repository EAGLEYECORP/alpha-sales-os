<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0A0807}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Palette RÉELLE du produit (app/globals.css) — rien d'inventé.
const INK="#0A0807", INK8="#201B15", PAPER="#F3EEE4", DIM="#A79F92",
      BRONZE="#E8C98A", RED="#E5564E";
const W=1080, H=1920, FPS=30, DUR=25.6;
const DISPLAY='"Liberation Sans", "DejaVu Sans", sans-serif';
const ctx = document.getElementById("c").getContext("2d");

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
// Fondu montant : opacité + remontée. Le vocabulaire de mouvement du produit.
function fadeUp(t,delay){const p=easeOut((t-delay)/0.45);return{a:clamp((t-delay)/0.35,0,1),dy:28*(1-p)};}

function lines(txt,x,y,size,color,lh,alpha,dy,align){
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color;
  ctx.font="bold "+size+"px "+DISPLAY; ctx.textAlign=align||"left"; ctx.textBaseline="top";
  txt.split("\n").forEach((l,i)=>ctx.fillText(l,x,y+dy+i*size*lh));
  ctx.restore();
}
// ⚠ Une rature doit TRAVERSER le texte. La première version posait une barre
// unique à la frontière des deux lignes : elle soulignait la première au lieu
// de nier les deux. Une barre par ligne, à la largeur RÉELLE du texte mesuré —
// une rature qui déborde ressemble à un trait de mise en page.
function rature(txt,x,y,size,lh,color,p){
  if(p<=0)return; ctx.save(); ctx.fillStyle=color;
  ctx.font="bold "+size+"px "+DISPLAY;
  txt.split("\n").forEach((l,i)=>{
    const w=ctx.measureText(l).width;
    ctx.fillRect(x,y+i*size*lh+size*0.52,w*clamp(p*1.6-i*0.6,0,1),11);
  });
  ctx.restore();
}
function bar(x,y,w,h,color,p,alpha){
  if(p<=0||alpha<=0)return; ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color;
  ctx.fillRect(x,y,w*p,h); ctx.restore();
}
function dot(x,y,r,color,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function plaque(x,y,w,h,alpha,dx,label){
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle=INK8; ctx.beginPath(); ctx.roundRect(x+dx,y,w,h,18); ctx.fill();
  ctx.fillStyle=BRONZE; ctx.fillRect(x+dx,y,8,h);
  ctx.fillStyle=PAPER; ctx.font="400 40px "+DISPLAY; ctx.textBaseline="middle";
  ctx.fillText(label,x+dx+40,y+h/2);
  ctx.restore();
}

function draw(T){
  ctx.fillStyle=INK; ctx.fillRect(0,0,W,H);
  const M=100;

  // ── 1 · L'ANCRAGE VÉRIFIABLE — une durée publique et datée ───────────
  if(T<3.6){const t=T;
    bar(M,700,120,6,BRONZE,easeOut(t/0.5),1);
    let f=fadeUp(t,0.15); lines("Votre permis\nest affiché",M,750,104,PAPER,1.12,f.a,f.dy);
    f=fadeUp(t,0.9); lines("depuis 4 mois.",M,1020,126,BRONZE,1.1,f.a,f.dy);
  }

  // ── 2 · LE RENVERSEMENT — on barre le cliché avant d'y être rangé ────
  else if(T<6.8){const t=T-3.6;
    lines("Vous ratez\ndes appels.",M,700,100,DIM,1.12,1,0);
    // La rature tombe d'un coup : c'est une négation, pas une transition.
    rature("Vous ratez\ndes appels.",M,700,100,1.12,RED,easeOut((t-0.72)/0.4));
    const f=fadeUp(t,1.45); lines("Non.",M,1010,104,PAPER,1.1,f.a,f.dy);
  }

  // ── 3 · LA VRAIE PERTE — abstrait : aucun visage, aucun faux témoin ──
  else if(T<12.0){const t=T-6.8;
    let f=fadeUp(t,0); lines("Vous avez rencontré\ndes acquéreurs.",M,560,88,DIM,1.14,f.a,f.dy);
    [[0.3,2.3],[0.45,2.6],[0.6,2.9]].forEach((d,i)=>{
      const on=clamp((t-d[0])/0.4,0,1), off=clamp((t-d[1])/0.5,0,1);
      dot(M+28+i*92,850,28,BRONZE,on*(1-off*0.88));
    });
    f=fadeUp(t,2.7); lines("Personne\nne les a rappelés.",M,960,100,PAPER,1.12,f.a,f.dy);
  }

  // ── 4 · LE MÉCANISME — le produit montré, pas promis ────────────────
  else if(T<18.2){const t=T-12.0;
    const f=fadeUp(t,0); lines("Alpha trie, relance,\nconsigne.",M,500,88,PAPER,1.14,f.a,f.dy);
    ["Qui rappeler aujourd'hui","Ce qui s'est dit la dernière fois",
     "Quand revenir sans agacer","Ce qui attend une réponse"].forEach((l,i)=>{
      const d=0.9+i*0.35, a=clamp((t-d)/0.35,0,1), dx=-44*(1-easeOut((t-d)/0.45));
      if(a>0) plaque(M,760+i*134,W-2*M,112,a,dx,l);
    });
  }

  // ── 5 · LA LIMITE — le plan qui rend les autres croyables ───────────
  else if(T<21.6){const t=T-18.2;
    let f=fadeUp(t,0);   lines("Il ne construit pas.",M,720,84,DIM,1.1,f.a,f.dy);
    f=fadeUp(t,0.5);     lines("Il ne serre pas\nla main.",M,840,84,DIM,1.14,f.a,f.dy);
    bar(M,1090,W-2*M,4,BRONZE,easeOut((t-1.45)/0.55),t>1.45?1:0);
    f=fadeUp(t,1.8);     lines("Tout le reste, si.",M,1140,44,PAPER,1.1,f.a,f.dy);
  }

  // ── 6 · LA SORTIE — un cadrage, pas un devis ────────────────────────
  else {const t=T-21.6; const cx=W/2;
    let f=fadeUp(t,0); lines("Un cadrage.\n20 minutes.",cx,760,100,PAPER,1.14,f.a,f.dy,"center");
    bar(cx-100,1020,200,6,BRONZE,easeOut((t-0.85)/0.5),t>0.85?1:0);
    f=fadeUp(t,1.1); lines("eagleyecorp.fr",cx,1070,66,BRONZE,1.1,f.a,f.dy,"center");
    f=fadeUp(t,1.6); lines("Lyon · Villeurbanne",cx,1180,34,DIM,1.1,f.a,f.dy,"center");
  }
}
window.__draw=draw; window.__FPS=FPS; window.__DUR=DUR;
draw(0);
</script>
